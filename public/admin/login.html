<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Administrativo</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2222%22 font-size=%2222%22>🔐</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page-body">

  <button type="button" class="btn-icon" id="loginThemeToggleBtn" style="position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); color: #fff;" title="Alternar Modo Claro / Escuro">
    <i class="fa-solid fa-moon" id="loginThemeToggleIcon"></i>
  </button>

  <div class="login-card">
    <div class="login-brand-header">
      <div class="login-icon-badge">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="login-title">Acesso Restrito</h1>
      <p class="login-subtitle">Painel de Gestão da Loja</p>
    </div>

    <!-- Mensagem de Alerta / Erro -->
    <div id="loginAlertBox" style="display: none; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.825rem; margin-bottom: 16px;"></div>

    <form id="adminLoginForm" class="login-form">
      <!-- Campo E-mail -->
      <div class="form-field">
        <label for="loginEmail">E-mail</label>
        <div class="form-input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="seu.email@dominio.com" required autocomplete="email">
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-field">
        <label for="loginSenha">Senha</label>
        <div class="form-input-wrap">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="loginSenha" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <!-- Botão de Ação -->
      <button type="submit" id="btnSubmitLogin" class="btn-login-submit">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Entrar no Painel</span>
      </button>
    </form>

    <div class="login-back-link">
      <a href="../index.html">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Mostruário Público
      </a>
    </div>
  </div>

  <script>
    // Gerenciamento de Tema
    const savedTheme = localStorage.getItem('mostruario_theme') || 
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyLoginTheme(savedTheme);

    const themeBtn = document.getElementById('loginThemeToggleBtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        applyLoginTheme(next);
      });
    }

    function applyLoginTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mostruario_theme', theme);
      const icon = document.getElementById('loginThemeToggleIcon');
      if (icon) {
        if (theme === 'dark') {
          icon.className = 'fa-solid fa-sun';
          icon.style.color = '#f59e0b';
        } else {
          icon.className = 'fa-solid fa-moon';
          icon.style.color = '';
        }
      }
    }

    // Redireciona se já houver sessão ativa
    const savedUser = localStorage.getItem('admin_user') || sessionStorage.getItem('admin_user');
    if (savedUser) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('loginAlertBox');
    const btnSubmit = document.getElementById('btnSubmitLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginSenha').value;

      if (!email || !senha) {
        showAlert('Preencha o e-mail e a senha.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Validando...</span>';
      hideAlert();

      const candidateUrls = [
        'http://localhost:3000/api',
        'http://localhost:3333/api',
        '/api'
      ];

      let loginSuccess = false;
      let lastErrorMessage = 'Não foi possível conectar ao servidor de autenticação.';

      for (const base of candidateUrls) {
        try {
          const res = await fetch(`${base}/usuarios/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
          });

          const data = await res.json();

          if (res.ok && data.usuario) {
            localStorage.setItem('mostruario_api_base', base);
            localStorage.setItem('admin_user', JSON.stringify(data.usuario));
            sessionStorage.setItem('admin_user', JSON.stringify(data.usuario));
            loginSuccess = true;
            showAlert('Login realizado com sucesso! Redirecionando...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 500);
            break;
          } else {
            lastErrorMessage = data.mensagem || 'Usuário ou senha incorretos.';
          }
        } catch (err) {
          // tenta próxima URL candidata
        }
      }

      if (!loginSuccess) {
        showAlert(lastErrorMessage, 'error');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Entrar no Painel</span>';
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      if (type === 'success') {
        alertBox.style.background = '#f0fdf4';
        alertBox.style.color = '#16a34a';
        alertBox.style.border = '1px solid #bbf7d0';
      } else {
        alertBox.style.background = '#fef2f2';
        alertBox.style.color = '#dc2626';
        alertBox.style.border = '1px solid #fecaca';
      }
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }
  </script>
</body>
</html>
